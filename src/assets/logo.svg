<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ScootNav logo: scootmobiel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- route van A naar B -->
  <path d="M18 112 H110" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="18" cy="112" r="5" fill="#4ade80"/>
  <circle cx="110" cy="112" r="5" fill="#f87171"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- stuur en mandje -->
    <path d="M86 80 L79 38" stroke-width="7"/>
    <path d="M71 37 L88 34" stroke-width="6"/>
    <path d="M85 47 H104 L100 61 H88 Z" stroke-width="4"/>
    <!-- wielen -->
    <circle cx="40" cy="91" r="12" stroke-width="6"/>
    <circle cx="95" cy="93" r="10" stroke-width="6"/>
  </g>
  <g fill="#fff">
    <!-- rugleuning, zitting, zitpaal, onderstel -->
    <rect x="26" y="31" width="10" height="31" rx="5"/>
    <rect x="28" y="54" width="34" height="10" rx="5"/>
    <rect x="41" y="62" width="7" height="14" rx="2"/>
    <rect x="30" y="72" width="66" height="10" rx="5"/>
    <rect x="34" y="45" width="22" height="5" rx="2.5"/>
    <circle cx="40" cy="91" r="3"/>
    <circle cx="95" cy="93" r="3"/>
  </g>
</svg>
