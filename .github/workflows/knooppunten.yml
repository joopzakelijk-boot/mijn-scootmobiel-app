# Haalt de nieuwste fietsknooppunten op en slaat ze op in de repository
# (public/knooppunten.json). De app levert dat bestand mee, zodat er bij het
# gebruik niets geladen hoeft te worden.
# Draait elke maand, met de hand (knop "Run workflow"), en als het ophaalscript wijzigt.
name: Knooppunten bijwerken

on:
  schedule:
    - cron: '17 3 1 * *'   # de 1e van elke maand, 's nachts
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-knooppunten.mjs
      - .github/workflows/knooppunten.yml

permissions:
  contents: write

concurrency:
  group: knooppunten-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fietsknooppunten ophalen
        run: node scripts/fetch-knooppunten.mjs

      - name: Opslaan als er iets veranderd is
        run: |
          if [ ! -f public/knooppunten.json ]; then
            echo "::warning::Geen knooppunten opgehaald; het bestaande bestand blijft staan."
            exit 0
          fi
          git add public/knooppunten.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de knooppunten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fietsknooppunten bijwerken"
          git pull --rebase --autostash
          git push
